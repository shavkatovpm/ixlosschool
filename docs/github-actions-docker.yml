# COPY THIS FILE to .github/workflows/docker.yml through the GitHub web UI.
# The git credential on the dev machine is a token without the `workflow` scope, so it cannot push files
# under .github/workflows. Once a token with that scope is used, move the file there with git.
# Builds the production image and publishes it to GitHub Container Registry on every push to main.
# The droplet polls the registry and restarts the site container when a new image appears
# (see docs/deploy.md). No secrets are needed: the built-in GITHUB_TOKEN is enough.
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
